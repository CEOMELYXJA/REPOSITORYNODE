<!DOCTYPE html>

<head>

    <title>WAREZ STRING 2 - Core Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* warez string 2 alpha */
            background: 
                radial-gradient(circle, #9333ea 20%, transparent 20%) 0 0 / 20px 20px,
                radial-gradient(circle, #eab308 20%, transparent 20%) 10px 10px / 20px 20px,
                repeating-linear-gradient(45deg, #ef4444, #ef4444 10px, #ec4899 10px, #ec4899 20px);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .core-block {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            border-radius: 12px;
            /* Box node */
            background-color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
            border: 4px dashed #eab308; /* yy */
        }
        h1 {
            color: #ec4899; /* title */
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px #ef4444;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .btn-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #eab308; /* jj */
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: transform 0.2s;
        }
        .btn-link:hover {
            transform: scale(1.1);
            background-color: #ec4899; /* cc */
        }
    </style>
</head>
