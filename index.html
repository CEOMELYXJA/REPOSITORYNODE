<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAREZ STRING 2 - Core Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .core-block {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            border-radius: 12px;
            background-color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .btn-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-link:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <!-- Main project node -->
    <div class="core-block" id="root-hub">
        <h1>WAREZ STRING 2</h1>
        <p><strong>WAREZ STRING 2</strong> nv</p>
        <p>Alpha</p>
        <a href="#" class="btn-link" id="flow-action">Start Project</a>
    </div>

    <!-- TradingView asset feed -->
    <div class="tradingview-widget-container" id="stream-pool">
        <div class="tradingview-widget-container__widget"></div>
        <div class="tradingview-widget-copyright">
            <a href="https://tradingview.com" rel="noopener" target="_blank">
                <span class="blue-text">Ticker Tape</span>
            </a> by TradingView
        </div>
        <script type="text/javascript" src="https://tradingview.com" async>
        {
            "symbols": [
                {
                    "proName": "COINBASE:BTCUSD"
                },
                {
                    "proName": "COINBASE:ETHUSD"
                },
                {
                    "proName": "BINANCE:IOTAUSD"
                }
            ],
            "colorTheme": "dark",
            "isTransparent": false,
            "displayMode": "adaptive",
            "locale": "en"
        }
        </script>
    </div>

</body>
</html>
